<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>scoop.md settings</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="icons/icon48.png" alt="" width="24" height="24">
      <span>scoop.md</span>
    </div>
  </header>

  <main>
    <section class="card">
      <label class="row" for="share">
        <span class="text">
          <span class="title">Share with the library</span>
          <span class="meta">Public docs you scoop help the next person on that site. Pages behind a login are never shared.</span>
          <span class="meta">Turning this off stops uploads; looking up this page in the docs index still sends its address.</span>
        </span>
        <input id="share" type="checkbox" class="toggle" role="switch">
      </label>
    </section>

    <section class="card">
      <label class="row" for="telemetry">
        <span class="text">
          <span class="title">Send usage statistics</span>
          <span class="meta">Anonymous events: which public docs sites and pages you scoop, whether it worked, versions, browser, OS and errors. Never page content or anything signed-in.</span>
          <span class="meta">Install ID <span id="install-id" class="mono"></span>, for <a href="https://scoop.md/privacy#usage-statistics" target="_blank" rel="noopener">deletion requests</a>.</span>
        </span>
        <input id="telemetry" type="checkbox" class="toggle" role="switch">
      </label>
    </section>

    <section class="card">
      <div class="row">
        <span class="title" id="theme-label">Theme</span>
        <div class="segmented" role="radiogroup" aria-labelledby="theme-label">
          <label><input type="radio" name="theme" value="system"><span>System</span></label>
          <label><input type="radio" name="theme" value="light"><span>Light</span></label>
          <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <span class="text">
          <span class="title">Keyboard shortcut</span>
          <span id="shortcut" class="meta">…</span>
        </span>
        <button id="shortcuts" class="button" type="button">Change</button>
      </div>
    </section>
  </main>

  <footer class="foot">
    <a href="https://scoop.md/privacy" target="_blank" rel="noopener">Privacy</a>
    <a href="https://scoop.md/terms" target="_blank" rel="noopener">Terms</a>
    <span id="version"></span>
  </footer>
  <script type="module" src="options.js"></script>
</body>
</html>
